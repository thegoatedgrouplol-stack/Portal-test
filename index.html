<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- iOS Web App Full-Screen Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Violet">
    <title>Violet Signer</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        html, body { 
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #040208;
            color: #f3f4f6;
        }

        /* Ambient Glow Layer */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, rgba(168, 85, 247, 0.08) 40%, rgba(4, 2, 8, 0) 70%);
            z-index: 0;
            pointer-events: none;
            animation: ambientGlow 8s ease-in-out infinite alternate;
        }

        @keyframes ambientGlow {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* App Viewport Container */
        .app-viewport {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: relative;
            z-index: 10;
        }

        /* Navigation Header */
        header {
            flex-shrink: 0;
            background-color: rgba(9, 3, 20, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
            padding: calc(env(safe-area-inset-top) + 0.8rem) 1.5rem 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .violet-dot {
            width: 0.65rem;
            height: 0.65rem;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border-radius: 9999px;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.7);
            animation: dotPulse 2s infinite alternate;
        }

        @keyframes dotPulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffffff;
        }
        .brand-accent { color: #a855f7; }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background-color: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 0.3rem 0.85rem;
            border-radius: 9999px;
        }
        .status-dot {
            width: 0.4rem;
            height: 0.4rem;
            background-color: #34d399;
            border-radius: 9999px;
            position: relative;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background-color: #34d399;
            animation: radar 2s infinite linear;
        }

        @keyframes radar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        .status-text {
            font-size: 9.5px;
            font-weight: 800;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Main Scrollable Canvas */
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1.5rem 1.15rem calc(env(safe-area-inset-bottom) + 3rem) 1.15rem;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
        }

        main::-webkit-scrollbar { width: 4px; }
        main::-webkit-scrollbar-track { background: transparent; }
        main::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 9999px; }

        .hero-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
            line-height: 1.45;
        }

        /* Violet Signer Console Box */
        .signer-box {
            background: linear-gradient(145deg, rgba(23, 10, 43, 0.6) 0%, rgba(10, 3, 24, 0.4) 100%);
            border: 1px solid rgba(139, 92, 246, 0.22);
            border-radius: 1.35rem;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .signer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .signer-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #c084fc;
        }
        .cert-select {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #e9d5ff;
            font-size: 11px;
            font-weight: 700;
            padding: 0.3rem 0.6rem;
            border-radius: 0.6rem;
            outline: none;
        }

        .dropzone {
            border: 2px dashed rgba(139, 92, 246, 0.3);
            border-radius: 1rem;
            padding: 1.5rem 1rem;
            text-align: center;
            background: rgba(15, 5, 31, 0.35);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dropzone:hover {
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(26, 9, 52, 0.45);
        }
        .drop-icon {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }
        .drop-title { font-size: 13px; font-weight: 700; color: #ffffff; }
        .drop-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        .signer-controls {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .input-field {
            width: 100%;
            background: rgba(9, 3, 20, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.16);
            padding: 0.65rem 0.95rem;
            border-radius: 0.85rem;
            color: #ffffff;
            font-size: 12px;
            outline: none;
        }
        .input-field:focus { border-color: rgba(168, 85, 247, 0.5); }

        .sign-btn {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.75rem;
            border-radius: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
            transition: all 0.2s ease;
        }
        .sign-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); }

        .progress-bar-wrap {
            display: none;
            margin-top: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            height: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            transition: width 0.3s linear;
        }

        /* App Store Grid Section */
        .search-container { margin-bottom: 1.25rem; }
        .search-input {
            width: 100%;
            background-color: rgba(16, 5, 29, 0.55);
            border: 1px solid rgba(139, 92, 246, 0.16);
            padding: 0.85rem 1.25rem;
            border-radius: 1.1rem;
            color: #ffffff;
            font-size: 0.875rem;
            outline: none;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1.25rem;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .chip {
            background: rgba(16, 5, 29, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.12);
            color: #94a3b8;
            padding: 0.4rem 0.95rem;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active, .chip:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: #ffffff;
        }

        .app-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .glass-card {
            background-color: rgba(16, 5, 28, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.14);
            border-radius: 1.25rem;
            padding: 0.85rem 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 0.95rem;
        }
        .app-icon {
            width: 3.25rem;
            height: 3.25rem;
            border-radius: 0.95rem;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .app-name { font-size: 14.5px; font-weight: 700; color: #ffffff; line-height: 1.2; }
        .version-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            color: #c084fc;
            background-color: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            margin-top: 0.2rem;
        }
        .app-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.3rem;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .ipa-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            padding: 0.5rem 0.65rem;
            border-radius: 0.6rem;
            text-decoration: none;
        }

        .get-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.725rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.55rem 1.25rem;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- Navigation Header -->
        <header>
            <div class="brand-container">
                <span class="violet-dot"></span>
                <h1 class="brand-title">Violet<span class="brand-accent">.</span></h1>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="status-text">Signed</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <main>
            <section class="hero-section">
                <h2 class="hero-title">Violet Signer</h2>
                <p class="hero-subtitle">Standalone iOS application signing & direct web deployment portal.</p>
            </section>

            <!-- Signer Drag & Drop Tool -->
            <section class="signer-box">
                <div class="signer-header">
                    <span class="signer-title">IPA Signer Console</span>
                    <select class="cert-select">
                        <option>Enterprise Profile #1</option>
                        <option>Developer Cert #2</option>
                    </select>
                </div>

                <div class="dropzone" onclick="document.getElementById('file-input').click()">
                    <div class="drop-icon">📦</div>
                    <div class="drop-title" id="file-name">Tap or Drop .IPA File</div>
                    <div class="drop-sub">Supports iOS 14.0 - 18.x packages</div>
                    <input type="file" id="file-input" accept=".ipa" style="display: none" onchange="handleFile(this)">
                </div>

                <div class="signer-controls">
                    <input type="text" class="input-field" placeholder="Custom Bundle ID (e.g. com.violet.app)">
                    <button class="sign-btn" onclick="startSigning()">Sign Package</button>
                    <div class="progress-bar-wrap" id="progress-wrap">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                </div>
            </section>

            <!-- Search & Filters -->
            <div class="search-container">
                <input type="text" id="search-bar" class="search-input" placeholder="Search signed apps..." onkeyup="filterApps()">
            </div>

            <div class="filter-bar">
                <button class="chip active" onclick="selectCategory('all', this)">All Apps</button>
                <button class="chip" onclick="selectCategory('tweaks', this)">Tweaks</button>
                <button class="chip" onclick="selectCategory('emulators', this)">Emulators</button>
                <button class="chip" onclick="selectCategory('games', this)">Games</button>
            </div>

            <!-- Apps Container -->
            <div id="app-grid" class="app-grid">
                <!-- App items render dynamically -->
            </div>
        </main>
    </div>

    <script>
        let allApps = [
            { name: "Violet Store", version: "1.0.0", category: "tweaks", description: "Official Violet sideloading store client.", icon: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&h=150&fit=crop", ipa_url: "#" },
            { name: "Delta Emulator", version: "1.6", category: "emulators", description: "Multi-system game emulator for iOS.", icon: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=150&h=150&fit=crop", ipa_url: "#" }
        ];

        function renderGrid(apps) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = "glass-card";
                card.innerHTML = `
                    <div class="app-info">
                        <img src="${app.icon}" class="app-icon" alt="${app.name}">
                        <div>
                            <h3 class="app-name">${app.name}</h3>
                            <span class="version-tag">v${app.version}</span>
                            <p class="app-desc">${app.description}</p>
                        </div>
                    </div>
                    <div class="action-group">
                        <a href="${app.ipa_url}" download class="ipa-btn">IPA</a>
                        <a href="itms-services://?action=download-manifest&url=${app.ipa_url}" class="get-btn">Get</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleFile(input) {
            if(input.files && input.files[0]) {
                document.getElementById('file-name').innerText = input.files[0].name;
            }
        }

        function startSigning() {
            const wrap = document.getElementById('progress-wrap');
            const fill = document.getElementById('progress-fill');
            wrap.style.display = 'block';
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    alert("Signing completed! Package ready for deployment.");
                } else {
                    width += 10;
                    fill.style.width = width + '%';
                }
            }, 200);
        }

        renderGrid(allApps);
    </script>
</body>
</html>
