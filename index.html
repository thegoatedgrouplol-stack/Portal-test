<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Violet Web</title>
    <style>
        @import url('https://googleapis.com');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #000000;
            color: #f3f4f6;
            min-height: 100vh;
            padding-bottom: 5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Dynamic Background Gradients */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(20, 6, 38, 0.05) 60%, transparent 100%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.7; height: 55vh; }
            100% { opacity: 1; height: 65vh; }
        }
        
        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(10, 3, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .violet-dot {
            width: 0.65rem;
            height: 0.65rem;
            background-color: #a855f7;
            border-radius: 9999px;
            box-shadow: 0 0 15px #a855f7, 0 0 30px #a855f7;
            animation: corePulse 2s infinite alternate;
        }

        @keyframes corePulse {
            0% { transform: scale(0.9); box-shadow: 0 0 10px #a855f7; }
            100% { transform: scale(1.1); box-shadow: 0 0 20px #a855f7, 0 0 35px #a855f7; }
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffffff;
        }
        .brand-accent { color: #a855f7; }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background-color: rgba(52, 211, 153, 0.06);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
        }
        .status-dot {
            width: 0.4rem;
            height: 0.4rem;
            background-color: #34d399;
            border-radius: 9999px;
            position: relative;
        }
        .status-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background-color: #34d399;
            animation: radar 2s infinite linear;
        }

        @keyframes radar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .status-text {
            font-size: 10px;
            font-weight: 800;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Central Container */
        main {
            position: relative;
            z-index: 1;
            max-width: 540px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.35rem;
            letter-spacing: -0.03em;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }
        .hero-subtitle {
            font-size: 0.825rem;
            color: #9ca3af;
            font-weight: 500;
            margin-bottom: 2.25rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        /* Metrics Grid Row */
        .stats-row {
            display: grid;
            grid-template-cols: repeat(3, 1fr);
            gap: 0.85rem;
            margin-bottom: 2.25rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(26, 12, 47, 0.25) 0%, rgba(15, 5, 30, 0.15) 100%);
            border: 1px solid rgba(168, 85, 247, 0.08);
            border-radius: 1rem;
            padding: 0.85rem;
            text-align: center;
            transition: border-color 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(168, 85, 247, 0.2);
        }
        .stat-val {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }
        .stat-lbl {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #a855f7;
            font-weight: 700;
            margin-top: 0.2rem;
        }

        /* Search Input */
        .search-container {
            margin-bottom: 1.75rem;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
        }
        .search-input {
            width: 100%;
            background-color: rgba(18, 6, 34, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.15);
            padding: 0.95rem 1.35rem;
            border-radius: 1.15rem;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .search-input:focus {
            border-color: rgba(168, 85, 247, 0.6);
            background-color: rgba(22, 7, 42, 0.7);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            transform: scale(1.01);
        }

        /* Smooth Application Grid Frame */
        .app-grid {
            display: flex;
            flex-direction: column;
            gap: 0.95rem;
        }

        /* Entrance Animations for Cards via JS */
        .glass-card {
            background-color: rgba(17, 5, 31, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(168, 85, 247, 0.12);
            border-radius: 1.35rem;
            padding: 1.15rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
            animation: cardReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.35);
            transform: translateY(-2px) scale(1.01);
            background-color: rgba(23, 8, 41, 0.55);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.08);
        }
        
        .app-info {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }
        .app-icon-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .app-icon {
            width: 3.85rem;
            height: 3.85rem;
            border-radius: 1.15rem;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }
        .glass-card:hover .app-icon {
            transform: scale(1.03) rotate(1deg);
        }
        
        .app-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        .version-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: #b566ff;
            background-color: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.18);
            padding: 0.15rem 0.45rem;
            border-radius: 5px;
            margin-top: 0.3rem;
        }
        .app-desc {
            font-size: 0.78rem;
            color: #9ca3af;
            margin-top: 0.4rem;
            font-weight: 500;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Buttons */
        .get-btn {
            background-color: #a855f7;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.65rem 1.6rem;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }
        .get-btn:hover {
            background-color: #b566ff;
            box-shadow: 0 6px 22px rgba(168, 85, 247, 0.5);
            transform: scale(1.03);
        }
        .get-btn:active {
            transform: scale(0.96);
        }
/* Documentation & Help Area */
.help-section {
margin-top: 4rem;
border-top: 1px solid rgba(168, 85, 247, 0.1);
padding-top: 2rem;
animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
}
.help-heading {
font-size: 0.95rem;
font-weight: 700;
color: #ffffff;
margin-bottom: 1rem;
text-transform: uppercase;
letter-spacing: 0.06em;
}
.guide-box {
background-color: rgba(15, 6, 28, 0.3);
border: 1px solid rgba(168, 85, 247, 0.06);
border-radius: 1.25rem;
padding: 1.25rem;
}
.guide-step {
font-size: 0.825rem;
color: #9ca3af;
line-height: 1.6;
margin-bottom: 0.65rem;
}
.guide-step:last-child { margin-bottom: 0; }
.guide-accent { color: #c084fc; font-weight: 600; }
/* Structural Framework Keyframes */
@keyframes fadeInUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
from { opacity: 0; transform: translateY(-15px); }
to { opacity: 1; transform: translateY(0); }
}
.spinner {
width: 1.5rem;
height: 1.5rem;
border: 2px solid transparent;
border-top-color: #a855f7;
border-radius: 50%;
animation: spin 0.6s linear infinite;
margin: 3rem auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

let allApps = [];
async function fetchAppLibrary() {
try {
const response = await fetch('apps.json');
const data = await response.json();
allApps = data.apps;
document.getElementById('stat-apps').innerText = allApps.length;
renderGrid(allApps);
} catch (err) {
console.error("Pipeline failure resolving data elements:", err);
document.getElementById('app-grid').innerHTML = <div style="border: 1px solid rgba(239,68,68,0.2); background: rgba(239,68,68,0.02); border-radius: 1.25rem; padding: 1.5rem; text-align: center;"> <p style="color: #f87171; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Failed to parse apps.json configuration file.</p> </div>;
}
}
// Staggered list element entry animation pipeline
function renderGrid(apps) {
const grid = document.getElementById('app-grid');
grid.innerHTML = '';
if(apps.length === 0) {
grid.innerHTML = 'No matching deployment manifests detected.';
return;
}
apps.forEach((app, index) => {
const card = document.createElement('div');
card.className = "glass-card";
// Inject progressive millisecond delays to construct cascading visual entrance
card.style.animationDelay = ${index * 60}ms;
card.innerHTML = <div class="app-info"> <div class="app-icon-wrapper"> <img src="${app.icon}" class="app-icon" alt="${app.name}"> </div> <div> <h3 class="app-name">${app.name}</h3> <span class="version-tag">v${app.version}</span> <p class="app-desc">${app.description}</p> </div> </div> <a href="itms-services://?action=download-manifest&url=${app.ipa_url}" class="get-btn"> Get </a>;
grid.appendChild(card);
});
}
function filterApps() {
const query = document.getElementById('search-bar').value.toLowerCase();
const filtered = allApps.filter(app =>
app.name.toLowerCase().includes(query) ||
app.description.toLowerCase().includes(query)
);
renderGrid(filtered);
}
fetchAppLibrary();
