<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scarlet Web</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-[#0e0204] via-[#070002] to-[#000000] text-gray-100 min-h-screen selection:bg-[#ff1a40]/30 selection:text-white pb-12">

    <!-- Scarlet Glowing Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#0e0204]/70 border-b border-[#ff1a40]/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            
            <span class="w-3 h-3 rounded-full bg-[#ff1a40] shadow-[0_0_12px_#ff1a40]"></span>
            <h1 class="text-xl font-extrabold uppercase tracking-wider text-white">Scarlet<span class="text-[#ff1a40]">.</span></h1>
        </div>
        <div class="flex items-center gap-2 bg-[#ff1a40]/10 border border-[#ff1a40]/20 px-3 py-1 rounded-full">
            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
            <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">Signed</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-5 pt-8">
        
        <!-- Hero Branding Accent -->
        <div class="mb-8 text-center sm:text-left">
            <h2 class="text-3xl font-extrabold text-white tracking-tight leading-none mb-1">Native Sideloading</h2>
            <p class="text-xs text-gray-400 tracking-wide font-medium">Select an application below to begin installation.</p>
        </div>

        <!-- Scarlet App Library Grid -->
        <div id="app-grid" class="space-y-3.5">
            <!-- Loading Placeholder State -->
            <div class="bg-[#130508]/40 border border-[#ff1a40]/5 rounded-2xl p-5 flex items-center justify-center">
                <div class="w-5 h-5 border-2 border-t-transparent border-[#ff1a40] rounded-full animate-spin"></div>
            </div>
        </div>
    </main>

    <!-- JavaScript Data Engine -->
    <script>
        async function loadScarletApps() {
            try {
                const response = await fetch('apps.json');
                const data = await response.json();
                const grid = document.getElementById('app-grid');
                grid.innerHTML = ''; // Clear placeholder animation

                data.apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = "bg-[#140609]/60 backdrop-blur-md border border-[#ff1a40]/10 rounded-2xl p-4 flex items-center justify-between hover:border-[#ff1a40]/20 transition-all duration-300 group";
                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <!-- App Icon Frame -->
                            <div class="relative">
                                <img src="${app.icon}" class="w-14 h-14 rounded-[22%] object-cover shadow-lg border border-white/5 group-hover:scale-[1.02] transition duration-300" alt="${app.name}">
                                <div class="absolute inset-0 rounded-[22%] ring-1 ring-inset ring-white/10"></div>
                            </div>
                            <!-- App Details -->
                            <div>
                                <h3 class="font-bold text-white text-[15px] tracking-tight leading-snug group-hover:text-[#ff1a40] transition duration-200">${app.name}</h3>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <span class="text-[10px] font-bold text-[#ff1a40] bg-[#ff1a40]/10 px-1.5 py-0.5 rounded border border-[#ff1a40]/10">v${app.version}</span>
                                </div>
                                <p class="text-xs text-gray-400 line-clamp-1 mt-1 font-medium max-w-[180px] sm:max-w-[260px]">${app.description}</p>
                            </div>
                        </div>
                        <!-- Scarlet Red Action Button -->
                        <a href="itms-services://?action=download-manifest&url=${app.ipa_url}" 
                           class="bg-[#ff1a40] hover:bg-[#e01235] text-white font-bold text-xs uppercase tracking-widest px-5 py-2.5 rounded-full shadow-[0_4px_16px_rgba(255,26,64,0.25)] hover:shadow-[0_4px_20px_rgba(255,26,64,0.4)] transition-all active:scale-95 duration-200">
                            Get
                        </a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('UI rendering exception:', error);
                document.getElementById('app-grid').innerHTML = `
                    <div class="border border-red-500/20 bg-red-500/5 rounded-2xl p-4 text-center">
                        <p class="text-red-400 text-xs font-semibold uppercase tracking-wider">Failed to parse Scarlet data source.</p>
                    </div>
                `;
            }
        }
        loadScarletApps();
    </script>
</body>
</html>
