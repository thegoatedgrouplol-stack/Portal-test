<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Violet">
    <title>Violet — Sideloading Unimagined</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #08060e;
            --card-bg: rgba(22, 16, 38, 0.45);
            --card-border: rgba(139, 92, 246, 0.16);
            --violet-primary: #8b5cf6;
            --violet-glow: #a855f7;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* SideStore Style Radial Ambient Lighting */
        body::before {
            content: '';
            position: fixed;
            top: -20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, rgba(168, 85, 247, 0.05) 50%, rgba(8, 6, 14, 0) 80%);
            z-index: 0;
            pointer-events: none;
        }

        /* Sticky Navigation Header Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(8, 6, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.12);
            padding: calc(env(safe-area-inset-top) + 0.9rem) 1.5rem 0.9rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .brand-icon {
            width: 1.8rem;
            height: 1.8rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            border-radius: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.5);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }
        .brand-accent { color: var(--violet-primary); }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 800;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-dot {
            width: 0.4rem;
            height: 0.4rem;
            background-color: #34d399;
            border-radius: 9999px;
        }

        /* Container & Hero Layout */
        main {
            position: relative;
            z-index: 10;
            max-width: 540px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #c084fc;
            padding: 0.3rem 0.85rem;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.75rem;
        }
        .hero-title span {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.925rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 500;
            max-width: 440px;
            margin: 0 auto 1.75rem auto;
        }

        /* SideStore Action Button Bar */
        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.75rem 1.6rem;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.25s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(139, 92, 246, 0.55); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.75rem 1.6rem;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        /* Search & Category Pills */
        .search-box {
            margin-bottom: 1.25rem;
        }
        .search-input {
            width: 100%;
            background: rgba(18, 12, 33, 0.6);
            border: 1px solid var(--card-border);
            padding: 0.9rem 1.25rem;
            border-radius: 1.1rem;
            color: #ffffff;
            font-size: 0.875rem;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.25s ease;
        }
        .search-input:focus { border-color: rgba(139, 92, 246, 0.5); }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(18, 12, 33, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.12);
            color: var(--text-sub);
            padding: 0.45rem 1rem;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .chip.active, .chip:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: #ffffff;
        }

        /* SideStore Style App Cards Grid */
        .app-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 1.35rem;
            padding: 1rem 1.15rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }
        .app-card:hover {
            border-color: rgba(139, 92, 246, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.1);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .app-icon {
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 0.95rem;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-title { font-size: 15px; font-weight: 700; color: #ffffff; }
        .version-badge {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 700;
            color: #c084fc;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 0.15rem 0.45rem;
            border-radius: 5px;
            margin-top: 0.2rem;
        }
        .app-desc {
            font-size: 0.775rem;
            color: var(--text-sub);
            margin-top: 0.25rem;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-actions {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .btn-ipa {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            padding: 0.55rem 0.75rem;
            border-radius: 0.65rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-ipa:hover { background: rgba(255, 255, 255, 0.14); color: #ffffff; }

        .btn-get {
            background: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.6rem 1.3rem;
            border-radius: 9999px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
            transition: all 0.2s ease;
        }
        .btn-get:hover { transform: scale(1.03); box-shadow: 0 6px 18px rgba(139, 92, 246, 0.5); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="brand-logo">
            <div class="brand-icon">V</div>
            <span class="brand-title">Violet<span class="brand-accent">.</span></span>
        </a>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Signed</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        <!-- SideStore Inspired Hero -->
        <section class="hero-section">
            <span class="hero-badge">Next-Gen Sideloading</span>
            <h1 class="hero-title">Sideloading, <span>Unimagined.</span></h1>
            <p class="hero-subtitle">Direct mobile app distribution, enterprise signing, and custom repositories built directly for your iOS ecosystem.</p>
            <div class="hero-actions">
                <a href="itms-services://?action=download-manifest&url=#" class="btn-primary">Install Violet</a>
                <a href="https://github.com/thegoatedgrouplol-stack/Portal-test" target="_blank" class="btn-secondary">GitHub</a>
            </div>
        </section>

        <!-- Search Engine Console -->
        <div class="search-box">
            <input type="text" id="search-bar" class="search-input" placeholder="Search applications & tweaks..." onkeyup="filterApps()">
        </div>

        <!-- Filter Chips -->
        <div class="filter-chips">
            <button class="chip active" onclick="selectCategory('all', this)">All Apps</button>
            <button class="chip" onclick="selectCategory('tweaks', this)">Tweaks</button>
            <button class="chip" onclick="selectCategory('emulators', this)">Emulators</button>
            <button class="chip" onclick="selectCategory('games', this)">Games</button>
        </div>

        <!-- Dynamic Apps Grid -->
        <div id="app-grid" class="app-grid"></div>
    </main>

    <script>
        let allApps = [];
        let currentCategory = 'all';

        async function fetchAppLibrary() {
            try {
                const response = await fetch('apps.json');
                const data = await response.json();
                allApps = data.apps || [];
                renderGrid(allApps);
            } catch (err) {
                console.error("Failed to fetch apps.json:", err);
            }
        }

        function renderGrid(apps) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';

            if(!apps || apps.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#64748b; font-size:0.8rem; margin:2rem 0;">No matching apps found.</p>';
                return;
            }

            apps.forEach((app) => {
                const card = document.createElement('div');
                card.className = "app-card";
                card.innerHTML = `
                    <div class="app-left">
                        <img src="${app.icon || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&h=150&fit=crop'}" class="app-icon" alt="${app.name}">
                        <div>
                            <h3 class="app-title">${app.name || 'App Package'}</h3>
                            <span class="version-badge">v${app.version || '1.0'}</span>
                            <p class="app-desc">${app.description || 'No description provided.'}</p>
                        </div>
                    </div>
                    <div class="app-actions">
                        <a href="${app.ipa_url || '#'}" download class="btn-ipa">IPA</a>
                        <a href="itms-services://?action=download-manifest&url=${app.ipa_url || '#'}" class="btn-get">Get</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterApps() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const name = (app.name || "").toLowerCase();
                const desc = (app.description || "").toLowerCase();
                const category = (app.category || "").toLowerCase();
                
                const matchesCategory = currentCategory === 'all' || category === currentCategory;
                const matchesSearch = name.includes(query) || desc.includes(query);

                return matchesCategory && matchesSearch;
            });
            renderGrid(filtered);
        }

        function selectCategory(category, el) {
            currentCategory = category;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterApps();
        }

        fetchAppLibrary();
    </script>
</body>
</html>
