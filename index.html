<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Violet — Sideloading Unimagined</title>
    <!-- Tailwind CSS CDN for instant styling without build tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        violetBrand: '#8b5cf6',
                        violetGlow: '#a855f7',
                        violetDark: '#07040d'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#07040d] text-gray-100 min-h-screen relative overflow-x-hidden">

    <!-- SideStore Signature Ambient Top Glow -->
    <div class="fixed -top-40 left-1/2 -translate-x-1/2 w-[120vw] h-[60vh] bg-radial from-purple-600/20 via-fuchsia-500/5 to-transparent pointer-events-none z-0"></div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#07040d]/80 border-b border-purple-500/10 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-extrabold text-white text-sm shadow-lg shadow-purple-500/30">
                V
            </div>
            <span class="font-extrabold text-xl tracking-tight text-white">Violet<span class="text-purple-500">.</span></span>
        </div>
        <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-[10px] font-extrabold text-emerald-400 uppercase tracking-wider">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Signed
        </div>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 max-w-xl mx-auto px-5 py-12">
        
        <!-- SideStore 1-to-1 Hero Section -->
        <section class="text-center mb-10">
            <span class="inline-block bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-semibold px-3 py-1 rounded-full mb-4">
                Next-Gen Sideloading
            </span>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">
                Sideloading, <span class="bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Unimagined.</span>
            </h1>
            <p class="text-gray-400 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-6">
                An advanced iOS sideloading portal and distribution layer built for seamless over-the-air installs.
            </p>
            <div class="flex justify-center gap-3">
                <a href="#" class="bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold text-sm px-6 py-3 rounded-full shadow-lg shadow-purple-500/25 hover:scale-105 transition">
                    Install Violet
                </a>
                <button onclick="navigator.clipboard.writeText(window.location.origin + '/apps.json')" class="bg-white/5 border border-white/10 text-white font-bold text-sm px-6 py-3 rounded-full hover:bg-white/10 transition">
                    Copy Repo Link
                </button>
            </div>
        </section>

        <!-- Search Engine Console -->
        <div class="mb-4">
            <input type="text" id="search-input" onkeyup="filterApps()" placeholder="Search applications library..." class="w-full bg-[#120a21]/60 border border-purple-500/20 rounded-2xl px-5 py-3.5 text-sm text-white focus:outline-none focus:border-purple-500/50 backdrop-blur-md transition">
        </div>

        <!-- Filter Chips Bar -->
        <div class="flex gap-2 overflow-x-auto pb-4 scrollbar-none mb-4">
            <button class="chip active bg-purple-600/30 border border-purple-500/40 text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap" onclick="filterCategory('all', this)">All Apps</button>
            <button class="chip bg-[#120a21]/40 border border-purple-500/10 text-gray-400 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap hover:text-white" onclick="filterCategory('tweaks', this)">Tweaks</button>
            <button class="chip bg-[#120a21]/40 border border-purple-500/10 text-gray-400 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap hover:text-white" onclick="filterCategory('emulators', this)">Emulators</button>
        </div>

        <!-- App Grid Mount Point -->
        <div id="app-grid" class="flex flex-col gap-3"></div>
    </main>

    <script>
        let appsData = [];

        async function loadApps() {
            try {
                const res = await fetch('apps.json');
                const data = await res.json();
                appsData = data.apps || [];
                renderGrid(appsData);
            } catch (err) {
                console.error(err);
            }
        }

        function renderGrid(apps) {
            const container = document.getElementById('app-grid');
            container.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = "bg-[#120a21]/40 border border-purple-500/15 backdrop-blur-md rounded-2xl p-4 flex items-center justify-between hover:border-purple-500/30 transition";
                card.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <img src="${app.icon}" class="w-12 h-12 rounded-xl object-cover border border-white/10" alt="${app.name}">
                        <div>
                            <h3 class="font-bold text-white text-sm">${app.name}</h3>
                            <span class="inline-block bg-purple-500/10 border border-purple-500/20 text-purple-300 text-[9px] font-bold px-1.5 py-0.5 rounded mt-0.5">v${app.version}</span>
                            <p class="text-xs text-gray-400 max-w-[150px] truncate mt-0.5">${app.description}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="${app.ipa_url}" download class="bg-white/5 border border-white/10 text-gray-300 text-xs font-bold px-3 py-2 rounded-xl hover:bg-white/15 transition">IPA</a>
                        <a href="itms-services://?action=download-manifest&url=${app.ipa_url}" class="bg-gradient-to-r from-purple-600 to-pink-500 text-white text-xs font-extrabold uppercase px-4 py-2 rounded-full shadow-md shadow-purple-500/20 hover:scale-105 transition">Get</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterApps() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = appsData.filter(a => a.name.toLowerCase().includes(query) || a.description.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        loadApps();
    </script>
</body>
</html>
